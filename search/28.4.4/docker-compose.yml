services:
  search:
    image: "manticoresearch/manticore:28.4.4"
    volumes:
      - search_data:/var/lib/manticore
      - ./init.sh:/docker-entrypoint-init.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-init.sh"]
    command: ["docker-entrypoint.sh", "searchd", "-c", "/etc/manticoresearch/manticore.conf.sh", "--nodetach"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9306", "-e", "SHOW STATUS"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 管理员状态仪表盘（菜单「搜索状态」）：引擎直连 search:9306，
  # 失败表/管理员列表走主库，同步锁/模型缓存直读主程序 Redis
  search-dashboard:
    image: "dootask/search:${PLUGIN_VERSION}"
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE:-PRC}"
      SEARCH_PLUGIN_VERSION: "${PLUGIN_VERSION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PREFIX: "${DB_PREFIX}"
      # 主程序 .env 里 REDIS_PASSWORD=null 是字面量，代码侧按无密码处理
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # 主程序全局密钥：派生向量服务探测密钥（与引擎建表用的同一把派生钥）
      APP_KEY: "${APP_KEY}"
      # 应用身份（内置变量）：菜单角标推送鉴权
      APP_ID: "${APP_ID}"
      APP_SECRET: "${APP_SECRET}"
    depends_on:
      - search

volumes:
  search_data:
