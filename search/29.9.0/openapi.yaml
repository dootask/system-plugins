openapi: 3.0.3
info:
  title: Search Status API
  description: |
    Manticore 智能搜索的状态与运维接口（仅管理员）。
    调用需携带管理员用户 Token（doo app call 自动带当前用户身份）。
  version: 29.9.0
paths:
  /apps/search/api/status:
    get:
      operationId: status
      x-doo-cli-name: status
      summary: 查看搜索服务状态（引擎/索引覆盖/同步任务/失败队列/向量服务）
      responses:
        '200':
          description: 状态汇总
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: 引擎信息、各类型索引覆盖率、同步任务锁状态、失败队列统计、向量服务健康
  /apps/search/api/failures:
    get:
      operationId: failures
      x-doo-cli-name: failures
      summary: 查看同步失败队列
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 失败记录列表
    post:
      operationId: retryFailures
      x-doo-cli-name: retry-failures
      summary: 全部失败立即重试（1 分钟内由主程序重试任务处理）
      responses:
        '200':
          description: 已加入重试队列
  /apps/search/api/locks/clear:
    post:
      operationId: clearLocks
      x-doo-cli-name: clear-locks
      summary: 清理同步残锁（进程被杀后的锁残留，清除后同步 1 分钟内恢复）
      responses:
        '200':
          description: 清理结果
