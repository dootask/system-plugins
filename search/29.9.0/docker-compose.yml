services:
  search:
    image: "manticoresearch/manticore:29.9.0"
    volumes:
      - search_data:/var/lib/manticore
      - ./init.sh:/docker-entrypoint-init.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-init.sh"]
    # --replay-flags=ignore-open-errors：binlog 元数据登记了但磁盘上已不存在的日志文件直接跳过，
    # 否则非正常停机后引擎会反复 FATAL 崩溃重启（表数据本身完好，界面表现为「表缺失」）
    command: ["docker-entrypoint.sh", "searchd", "-c", "/etc/manticoresearch/manticore.conf.sh", "--nodetach", "--replay-flags=ignore-open-errors"]
    restart: unless-stopped
    # 大索引关停时要落盘 ramchunk，docker 默认 10 秒就 SIGKILL 会让 binlog 元数据与文件不一致
    stop_grace_period: 120s
    healthcheck:
      # --ssl-mode=DISABLED：升级时创建的首个 29.9.0 容器上，引擎的 mysql 端口曾声明支持 SSL 却握手失败
      # （默认 TLS 协商报 SSL connection error），使正常工作的引擎被误判 unhealthy；明文/unix socket 均正常。
      # 重装后未再复现，根因未查明（已排除：数据卷内容、环境变量、网络、向量请求）。探活不需要加密，故此处直接关掉
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9306", "--ssl-mode=DISABLED", "-e", "SHOW STATUS"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 管理员状态仪表盘（菜单「搜索状态」）：引擎直连 search:9306，
  # 失败表/管理员列表走主库，同步锁/模型缓存直读主程序 Redis
  search-dashboard:
    image: "dootask/search:${PLUGIN_VERSION}"
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE:-PRC}"
      SEARCH_PLUGIN_VERSION: "${PLUGIN_VERSION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PREFIX: "${DB_PREFIX}"
      # 主程序 .env 里 REDIS_PASSWORD=null 是字面量，代码侧按无密码处理
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # 主程序全局密钥：派生向量服务探测密钥（与引擎建表用的同一把派生钥）
      APP_KEY: "${APP_KEY}"
      # 应用身份（内置变量）：菜单角标推送鉴权
      APP_ID: "${APP_ID}"
      APP_SECRET: "${APP_SECRET}"
    depends_on:
      - search

volumes:
  search_data:
